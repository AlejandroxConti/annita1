<svg viewBox="0 0 1100 480" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0D131C"/>
      <stop offset="100%" stop-color="#111A27"/>
    </linearGradient>
    <marker id="arrow2" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#7C8AA0"/>
    </marker>
  </defs>
  <rect width="1100" height="480" fill="url(#bg2)"/>

  <text x="40" y="44" font-family="IBM Plex Sans, Arial, sans-serif" font-size="22" font-weight="600" fill="#E8EDF4">Annita-1 pipeline architecture</text>
  <text x="40" y="66" font-family="IBM Plex Sans, Arial, sans-serif" font-size="13" fill="#7C8AA0">phyBOARD-RT1170 (i.MX RT1176): M4 acquisition + M7 decision pipeline</text>

  <!-- Camera -->
  <rect x="40" y="180" width="140" height="90" rx="6" fill="#152233" stroke="#5B6A87" stroke-width="1.4"/>
  <text x="110" y="215" font-family="IBM Plex Sans, Arial, sans-serif" font-size="13" fill="#E8EDF4" text-anchor="middle">ESP32-S3</text>
  <text x="110" y="233" font-family="IBM Plex Sans, Arial, sans-serif" font-size="13" fill="#E8EDF4" text-anchor="middle">+ OV5640</text>
  <text x="110" y="253" font-family="IBM Plex Mono, monospace" font-size="10.5" fill="#7C8AA0" text-anchor="middle">stand-in sensor</text>

  <line x1="180" y1="225" x2="240" y2="225" stroke="#7C8AA0" stroke-width="1.6" marker-end="url(#arrow2)"/>
  <text x="210" y="215" font-family="IBM Plex Mono, monospace" font-size="10.5" fill="#7C8AA0" text-anchor="middle">UART</text>

  <!-- M4 -->
  <rect x="240" y="170" width="160" height="110" rx="6" fill="#0F2C3E" stroke="#3FA9D6" stroke-width="2"/>
  <text x="320" y="205" font-family="IBM Plex Sans, Arial, sans-serif" font-size="13" font-weight="600" fill="#3FA9D6" text-anchor="middle">M4 core</text>
  <text x="320" y="225" font-family="IBM Plex Sans, Arial, sans-serif" font-size="11.5" fill="#E8EDF4" text-anchor="middle">Frame acquisition</text>
  <text x="320" y="242" font-family="IBM Plex Sans, Arial, sans-serif" font-size="11.5" fill="#E8EDF4" text-anchor="middle">&amp; checksum validation</text>
  <text x="320" y="262" font-family="IBM Plex Mono, monospace" font-size="10.5" fill="#7C8AA0" text-anchor="middle">real-time, decoupled</text>

  <line x1="400" y1="225" x2="460" y2="225" stroke="#7C8AA0" stroke-width="1.6" marker-end="url(#arrow2)"/>
  <text x="430" y="215" font-family="IBM Plex Mono, monospace" font-size="10.5" fill="#7C8AA0" text-anchor="middle">shared mem</text>

  <!-- M7 pipeline stages -->
  <g>
    <rect x="460" y="90" width="130" height="60" rx="5" fill="#1A2436" stroke="#4E5C74" stroke-width="1.2"/>
    <text x="525" y="124" font-family="IBM Plex Sans, Arial, sans-serif" font-size="12" fill="#E8EDF4" text-anchor="middle">JPEG decode</text>

    <rect x="460" y="165" width="130" height="60" rx="5" fill="#1A2436" stroke="#4E5C74" stroke-width="1.2"/>
    <text x="525" y="199" font-family="IBM Plex Sans, Arial, sans-serif" font-size="12" fill="#E8EDF4" text-anchor="middle">PXP rotate</text>

    <rect x="460" y="240" width="130" height="60" rx="5" fill="#1A2436" stroke="#4E5C74" stroke-width="1.2"/>
    <text x="525" y="266" font-family="IBM Plex Sans, Arial, sans-serif" font-size="12" fill="#E8EDF4" text-anchor="middle">Quality score</text>
    <text x="525" y="282" font-family="IBM Plex Mono, monospace" font-size="10" fill="#7C8AA0" text-anchor="middle">sharpness · contrast</text>

    <rect x="460" y="315" width="130" height="60" rx="5" fill="#1A2436" stroke="#4E5C74" stroke-width="1.2"/>
    <text x="525" y="341" font-family="IBM Plex Sans, Arial, sans-serif" font-size="12" fill="#E8EDF4" text-anchor="middle">Classic features</text>
    <text x="525" y="357" font-family="IBM Plex Mono, monospace" font-size="10" fill="#7C8AA0" text-anchor="middle">histograms · edges</text>

    <line x1="590" y1="120" x2="620" y2="180" stroke="#4E5C74" stroke-width="1.2"/>
    <line x1="590" y1="195" x2="620" y2="200" stroke="#4E5C74" stroke-width="1.2"/>
    <line x1="590" y1="270" x2="620" y2="220" stroke="#4E5C74" stroke-width="1.2"/>
    <line x1="590" y1="345" x2="620" y2="240" stroke="#4E5C74" stroke-width="1.2"/>
  </g>

  <!-- TinyML -->
  <rect x="640" y="150" width="150" height="100" rx="6" fill="#241A33" stroke="#8A6FD1" stroke-width="1.6"/>
  <text x="715" y="188" font-family="IBM Plex Sans, Arial, sans-serif" font-size="13" font-weight="600" fill="#B7A6E8" text-anchor="middle">TinyML</text>
  <text x="715" y="207" font-family="IBM Plex Sans, Arial, sans-serif" font-size="11" fill="#E8EDF4" text-anchor="middle">Quantized CNN</text>
  <text x="715" y="224" font-family="IBM Plex Mono, monospace" font-size="10" fill="#7C8AA0" text-anchor="middle">trained on real</text>
  <text x="715" y="238" font-family="IBM Plex Mono, monospace" font-size="10" fill="#7C8AA0" text-anchor="middle">Sentinel-2 imagery</text>

  <line x1="790" y1="200" x2="850" y2="200" stroke="#7C8AA0" stroke-width="1.6" marker-end="url(#arrow2)"/>

  <!-- SVS -->
  <rect x="850" y="140" width="180" height="120" rx="6" fill="#2A1F14" stroke="#E3A857" stroke-width="2.2"/>
  <text x="940" y="176" font-family="IBM Plex Sans, Arial, sans-serif" font-size="14" font-weight="600" fill="#E3A857" text-anchor="middle">SVS engine</text>
  <text x="940" y="196" font-family="IBM Plex Sans, Arial, sans-serif" font-size="11" fill="#E8EDF4" text-anchor="middle">Science Value Score</text>
  <text x="940" y="216" font-family="IBM Plex Mono, monospace" font-size="10" fill="#7C8AA0" text-anchor="middle">quality + event</text>
  <text x="940" y="230" font-family="IBM Plex Mono, monospace" font-size="10" fill="#7C8AA0" text-anchor="middle">− transmission cost</text>

  <line x1="940" y1="260" x2="940" y2="300" stroke="#E3A857" stroke-width="1.8" marker-end="url(#arrow2)"/>

  <!-- Decisions -->
  <rect x="820" y="310" width="80" height="46" rx="5" fill="#152233" stroke="#5B6A87" stroke-width="1.2"/>
  <text x="860" y="338" font-family="IBM Plex Sans, Arial, sans-serif" font-size="11" fill="#7C8AA0" text-anchor="middle">Discard</text>

  <rect x="910" y="310" width="80" height="46" rx="5" fill="#2A1F14" stroke="#E3A857" stroke-width="1.4"/>
  <text x="950" y="338" font-family="IBM Plex Sans, Arial, sans-serif" font-size="11" fill="#E3A857" text-anchor="middle">Compress</text>

  <rect x="1000" y="310" width="80" height="46" rx="5" fill="#0F2C3E" stroke="#3FA9D6" stroke-width="1.4"/>
  <text x="1040" y="338" font-family="IBM Plex Sans, Arial, sans-serif" font-size="11" fill="#3FA9D6" text-anchor="middle">Transmit</text>

  <line x1="1040" y1="356" x2="1040" y2="400" stroke="#3FA9D6" stroke-width="1.8" marker-end="url(#arrow2)"/>
  <text x="1040" y="425" font-family="IBM Plex Sans, Arial, sans-serif" font-size="12" fill="#7C8AA0" text-anchor="middle">Downlink</text>
</svg>
