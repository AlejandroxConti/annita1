<svg viewBox="0 0 1000 640" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0D131C"/>
      <stop offset="100%" stop-color="#111A27"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#12345A"/>
      <stop offset="100%" stop-color="#0B2038"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="640" fill="url(#bg)"/>

  <text x="40" y="50" font-family="IBM Plex Sans, Arial, sans-serif" font-size="24" font-weight="600" fill="#E8EDF4">Where Annita-1 lives: 3U CubeSat bus (schematic)</text>
  <text x="40" y="76" font-family="IBM Plex Sans, Arial, sans-serif" font-size="14" fill="#7C8AA0">Illustrative block layout, not to scale — conceptual placement of the vision front-end payload</text>

  <!-- Solar panels -->
  <rect x="60" y="140" width="70" height="360" fill="url(#panel)" stroke="#3FA9D6" stroke-width="1.5" rx="4"/>
  <g stroke="#1B4A6E" stroke-width="1">
    <line x1="60" y1="180" x2="130" y2="180"/>
    <line x1="60" y1="220" x2="130" y2="220"/>
    <line x1="60" y1="260" x2="130" y2="260"/>
    <line x1="60" y1="300" x2="130" y2="300"/>
    <line x1="60" y1="340" x2="130" y2="340"/>
    <line x1="60" y1="380" x2="130" y2="380"/>
    <line x1="60" y1="420" x2="130" y2="420"/>
    <line x1="60" y1="460" x2="130" y2="460"/>
  </g>
  <text x="95" y="130" font-family="IBM Plex Sans, Arial, sans-serif" font-size="13" fill="#7C8AA0" text-anchor="middle">Solar array</text>

  <rect x="870" y="140" width="70" height="360" fill="url(#panel)" stroke="#3FA9D6" stroke-width="1.5" rx="4"/>
  <g stroke="#1B4A6E" stroke-width="1">
    <line x1="870" y1="180" x2="940" y2="180"/>
    <line x1="870" y1="220" x2="940" y2="220"/>
    <line x1="870" y1="260" x2="940" y2="260"/>
    <line x1="870" y1="300" x2="940" y2="300"/>
    <line x1="870" y1="340" x2="940" y2="340"/>
    <line x1="870" y1="380" x2="940" y2="380"/>
    <line x1="870" y1="420" x2="940" y2="420"/>
    <line x1="870" y1="460" x2="940" y2="460"/>
  </g>
  <text x="905" y="130" font-family="IBM Plex Sans, Arial, sans-serif" font-size="13" fill="#7C8AA0" text-anchor="middle">Solar array</text>

  <!-- Bus outline -->
  <rect x="180" y="110" width="640" height="420" fill="#131B28" stroke="#243149" stroke-width="2" rx="6"/>

  <!-- Subsystem stack -->
  <rect x="210" y="140" width="180" height="70" fill="#1A2436" stroke="#4E5C74" stroke-width="1.2" rx="4"/>
  <text x="300" y="180" font-family="IBM Plex Sans, Arial, sans-serif" font-size="14" fill="#E8EDF4" text-anchor="middle">ADCS</text>

  <rect x="210" y="225" width="180" height="70" fill="#1A2436" stroke="#4E5C74" stroke-width="1.2" rx="4"/>
  <text x="300" y="265" font-family="IBM Plex Sans, Arial, sans-serif" font-size="14" fill="#E8EDF4" text-anchor="middle">On-Board Computer</text>

  <rect x="210" y="310" width="180" height="70" fill="#1A2436" stroke="#4E5C74" stroke-width="1.2" rx="4"/>
  <text x="300" y="350" font-family="IBM Plex Sans, Arial, sans-serif" font-size="14" fill="#E8EDF4" text-anchor="middle">EPS / Battery</text>

  <rect x="210" y="395" width="180" height="70" fill="#1A2436" stroke="#4E5C74" stroke-width="1.2" rx="4"/>
  <text x="300" y="435" font-family="IBM Plex Sans, Arial, sans-serif" font-size="14" fill="#E8EDF4" text-anchor="middle">Comms / Downlink</text>

  <!-- Annita-1 payload, highlighted -->
  <rect x="430" y="150" width="360" height="290" fill="#0F2C3E" stroke="#3FA9D6" stroke-width="2.5" rx="6"/>
  <text x="610" y="180" font-family="IBM Plex Sans, Arial, sans-serif" font-size="17" font-weight="600" fill="#3FA9D6" text-anchor="middle">ANNITA-1 PAYLOAD</text>
  <text x="610" y="200" font-family="IBM Plex Sans, Arial, sans-serif" font-size="12" fill="#7C8AA0" text-anchor="middle">Vision Front-End for Flight Computer</text>

  <rect x="455" y="220" width="140" height="55" fill="#152233" stroke="#5B6A87" stroke-width="1" rx="4"/>
  <text x="525" y="243" font-family="IBM Plex Mono, monospace" font-size="12" fill="#E8EDF4" text-anchor="middle">Camera module</text>
  <text x="525" y="260" font-family="IBM Plex Mono, monospace" font-size="11" fill="#7C8AA0" text-anchor="middle">(sensor, swappable)</text>

  <rect x="625" y="220" width="140" height="55" fill="#152233" stroke="#5B6A87" stroke-width="1" rx="4"/>
  <text x="695" y="243" font-family="IBM Plex Mono, monospace" font-size="12" fill="#E8EDF4" text-anchor="middle">M4 core</text>
  <text x="695" y="260" font-family="IBM Plex Mono, monospace" font-size="11" fill="#7C8AA0" text-anchor="middle">acquisition</text>

  <line x1="595" y1="247" x2="625" y2="247" stroke="#3FA9D6" stroke-width="2"/>

  <rect x="540" y="300" width="140" height="55" fill="#152233" stroke="#E3A857" stroke-width="1.5" rx="4"/>
  <text x="610" y="323" font-family="IBM Plex Mono, monospace" font-size="12" fill="#E8EDF4" text-anchor="middle">M7 core</text>
  <text x="610" y="340" font-family="IBM Plex Mono, monospace" font-size="11" fill="#7C8AA0" text-anchor="middle">SVS decision engine</text>

  <line x1="695" y1="275" x2="695" y2="290" stroke="#3FA9D6" stroke-width="2"/>
  <line x1="695" y1="290" x2="610" y2="290" stroke="#3FA9D6" stroke-width="2"/>
  <line x1="610" y1="290" x2="610" y2="300" stroke="#3FA9D6" stroke-width="2"/>

  <text x="610" y="400" font-family="IBM Plex Sans, Arial, sans-serif" font-size="12" fill="#7C8AA0" text-anchor="middle">Only frames scored worth sending</text>
  <text x="610" y="418" font-family="IBM Plex Sans, Arial, sans-serif" font-size="12" fill="#7C8AA0" text-anchor="middle">leave the payload toward Comms →</text>

  <line x1="610" y1="380" x2="610" y2="390" stroke="#E3A857" stroke-width="2"/>
  <path d="M 430 430 L 390 430" stroke="#E3A857" stroke-width="2" marker-end="url(#arrow)"/>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#E3A857"/>
    </marker>
  </defs>

  <text x="500" y="580" font-family="IBM Plex Sans, Arial, sans-serif" font-size="12" fill="#4E5C74" text-anchor="middle">Layout is conceptual. Exact placement depends on the host bus, thermal design, and mission-specific integration.</text>
</svg>
